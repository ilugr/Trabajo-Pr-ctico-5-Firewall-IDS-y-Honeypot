# TP5 - Laboratorio Firewall / IDS / Honeypot (ARyS - IF046)
# Red aislada 10.0.0.0/24 con IPs estaticas.
# No se publican puertos al host: todo el trafico queda dentro de la bridge.

name: tp5-lab

services:
  servidor:
    build:
      context: .
      dockerfile: Dockerfile.servidor
    container_name: servidor
    hostname: servidor
    cap_add:
      - NET_ADMIN   # nftables / modo promiscuo de Suricata
      - NET_RAW     # AF_PACKET de Suricata
    networks:
      lab_net:
        ipv4_address: 10.0.0.10
    command: ["sleep", "infinity"]
    tty: true

  honeypot:
    image: cowrie/cowrie:latest
    container_name: honeypot
    hostname: honeypot
    # Cowrie 3.x permite configurar secciones con COWRIE_<SECCION>_<CLAVE>.
    # [ssh] listen_endpoints -> COWRIE_SSH_LISTEN_ENDPOINTS (antes listen_port).
    environment:
      COWRIE_SSH_ENABLED: "yes"
      COWRIE_SSH_LISTEN_ENDPOINTS: "tcp:22:interface=0.0.0.0"
    cap_add:
      - NET_BIND_SERVICE
    networks:
      lab_net:
        ipv4_address: 10.0.0.20

  atacante:
    build:
      context: .
      dockerfile: Dockerfile.atacante
    container_name: atacante
    hostname: atacante
    cap_add:
      - NET_ADMIN
      - NET_RAW     # necesario para nmap -sS (SYN scan)
    networks:
      lab_net:
        ipv4_address: 10.0.0.30
    command: ["sleep", "infinity"]
    tty: true

networks:
  lab_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.1
